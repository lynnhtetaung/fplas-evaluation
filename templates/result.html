<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison Result</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%; /* Ensuring the container doesn't take up the full width */
            margin: 0 auto; /* Center the container horizontally */
        }
        .image-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin: 20px 0;
            position: relative; /* To position the dotted line */
        }
        .image-row .image-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%; /* Each image-item takes up 45% of the container width */
        }
        .image-row img {
            max-width: 100%; /* Image takes up 100% of the image-item's width */
        }
        .dotted-line {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            border-left: 2px dotted #000; /* Dotted line */
            height: 70%; /* Adjust the height as needed */
            z-index: -1; /* Ensure it doesn't overlap the icons */
        }
        .highlight-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin: 20px 0;
        }
        .highlight-row .highlight-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%; /* Highlight image takes up 80% of the container width */
        }
        .highlight-row img {
            max-width: 100%; /* Image takes up 100% of the highlight-item's width */
            /* border: 4px solid red; Highlight the differences with a red border */
        }
        .image-label {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .icon {
            font-size: 2em;
            margin: 0 20px;
            display: flex;
            align-items: center;
            z-index: 1; /* Ensure the icon appears above the dotted line */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Output UI Image Comparison Result</h1>
        <div class="image-row">
            <div class="image-item">
                <div class="image-label">Your Image</div>
                <img src="http://localhost:5000/static/{{ student_image }}" alt="Student Image">

            </div>
            <div class="dotted-line"></div> <!-- Dotted line between images -->
            <div class="icon">
                <i class="fas fa-exchange-alt"></i>
            </div>
            <div class="image-item">
                <div class="image-label">Correct Image</div>
                <img src="http://localhost:5000/static/{{ correct_image }}" alt="Correct Image">
            </div>
        </div>
        <div class="highlight-row">
            <div class="highlight-item">
                <div class="image-label">Highlight Difference</div>
                <img src="http://localhost:5000/static/{{ highlight_image }}" alt="Highlight Difference">
            </div>
        </div>
    </div>
</body>
</html>
