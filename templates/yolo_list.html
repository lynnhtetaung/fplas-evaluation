<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Screenshot Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f8f9fa;
      color: #212529;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .category {
      margin-bottom: 40px;
    }

    .category h2 {
      margin: 0 0 20px;
      font-size: 1.5em;
      color: #007bff;
      border-bottom: 2px solid #007bff;
      display: inline-block;
      padding-bottom: 4px;
    }

    .masonry {
      column-count: 4;
      column-gap: 1rem;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      overflow: hidden;
      transition: transform 0.2s;
      cursor: pointer;
    }

    .masonry-item:hover {
      transform: scale(1.02);
    }

    .masonry-item img {
      width: 100%;
      max-width: 180px;
      display: block;
      margin: auto;
      border-bottom: 1px solid #eee;
    }

    .filename {
      font-size: 12px;
      padding: 8px;
      word-break: break-all;
      text-align: center;
    }

    @media (max-width: 768px) {
      .masonry {
        column-count: 2;
      }
    }

    @media (max-width: 480px) {
      .masonry {
        column-count: 1;
      }
    }

    /* Modal Styles */
    #popup {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    #popup img {
      max-width: 90%;
      max-height: 90%;
      border: 5px solid white;
      border-radius: 10px;
      box-shadow: 0 0 20px black;
    }
  </style>
</head>
<body>
  <h1>📸 Student Output Images</h1>

  {% for folder, images in categories.items() %}
  <div class="category">
    <h2>{{ folder|upper }}</h2>
    <div class="masonry">
      {% for img in images %}
      <div class="masonry-item" onclick="showPopup('{{ url_for('static', filename='screenshots/' + folder + '/' + img) }}')">
        <img src="{{ url_for('static', filename='screenshots/' + folder + '/' + img) }}" alt="{{ img }}">
        <div class="filename">{{ img }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
  {% endfor %}

  <div id="popup" onclick="hidePopup()">
    <img id="popup-img" src="" alt="Large view">
  </div>

  <script>
    function showPopup(src) {
      const popup = document.getElementById('popup');
      const popupImg = document.getElementById('popup-img');
      popupImg.src = src;
      popup.style.display = 'flex';
    }

    function hidePopup() {
      document.getElementById('popup').style.display = 'none';
      document.getElementById('popup-img').src = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hidePopup();
    });
  </script>
</body>
</html>
