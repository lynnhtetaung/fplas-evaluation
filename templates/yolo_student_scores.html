<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Student Evaluation Table</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --light-bg: linear-gradient(135deg, #f3e5f5, #e1f5fe);
      --dark-bg: #121212;
      --light-text: #333;
      --dark-text: #f1f1f1;
      --light-card: white;
      --dark-card: #1e1e1e;
      --blue: #42a5f5;
      --blue-dark: #1e88e5;
    }

    body {
      font-family: 'Roboto', sans-serif;
      padding: 40px;
      background: var(--light-bg);
      color: var(--light-text);
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.dark {
      background: var(--dark-bg);
      color: var(--dark-text);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .button-bar {
      text-align: center;
      margin-bottom: 20px;
    }

    .download-btn {
      margin: 5px;
      padding: 10px 20px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
    }

    .download-btn:hover {
      background: var(--blue-dark);
    }

    .toggle-container {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 1000;
    }

    .toggle-btn {
      background: var(--blue);
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .toggle-btn:hover {
      background: var(--blue-dark);
    }

    .container {
      background: var(--light-card);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transition: background 0.3s ease;
    }

    body.dark .container {
      background: var(--dark-card);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    table.dataTable td {
      vertical-align: middle;
      color: inherit;
    }

    table.dataTable thead th {
      background-color: #eeeeee;
      color: #000;
    }

    body.dark table.dataTable thead th {
      background-color: #333;
      color: #fff;
    }

    td.editable {
      background-color: #fff9c4;
      cursor: pointer;
    }

    body.dark td.editable {
      background-color: #444444;
      color: white;
    }

    td[data-type="score"] {
      font-weight: bold;
    }

    td[data-type="score"].high {
      color: limegreen;
    }

    td[data-type="score"].mid {
      color: orange;
    }

    td[data-type="score"].low {
      color: red;
    }
  </style>
</head>

<body>

  <!-- 🌗 Dark Mode Toggle -->
  <div class="toggle-container">
    <button class="toggle-btn" onclick="toggleDarkMode()">🌗 Toggle Mode</button>
  </div>

  <div class="container">
    <h2>📊 YOLO Evaluation Scores</h2>

    <div class="button-bar">
      <button class="download-btn" onclick="saveToCSV()">💾 Save Changes</button>
      <a class="download-btn" href="/yolo-download-scores">⬇ Download Latest CSV</a>
    </div>

    <table id="studentTable" class="display" style="width:100%">
      <thead>
        <tr>
          <th>Student Image</th>
          <th>Problem Type (%)</th>
          <th>Score</th>
          <th>Remark</th>
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
        <tr>
          <td>{{ row[0] }}</td>
          <td>{{ row[1] }}</td>
          <td class="editable" data-type="score" contenteditable="true">{{ row[2] }}</td>
          <td class="editable" contenteditable="true">{{ row[3] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

  <script>
    $(document).ready(function () {
      $('#studentTable').DataTable({ pageLength: 20 });
      applyScoreColors();

      $('#studentTable').on('input', 'td[data-type="score"]', applyScoreColors);
    });

    function applyScoreColors() {
      document.querySelectorAll('td[data-type="score"]').forEach(td => {
        const score = parseFloat(td.textContent.trim());
        td.classList.remove('high', 'mid', 'low');
        if (!isNaN(score)) {
          if (score >= 80) td.classList.add('high');
          else if (score >= 50) td.classList.add('mid');
          else td.classList.add('low');
        }
      });
    }

    function getCleanText(cell) {
      const div = document.createElement('div');
      div.innerHTML = cell.innerHTML;
      return div.textContent.trim().replace(/,/g, '');
    }

    function collectTableData() {
      const rows = [];
      document.querySelectorAll("#studentTable tbody tr").forEach(tr => {
        const cells = tr.querySelectorAll("td");
        const row = Array.from(cells).map(getCleanText);
        rows.push(row);
      });
      return rows;
    }

    function saveToCSV() {
      const data = collectTableData();
      fetch('/save-yolo-scores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
        .then(res => res.json())
        .then(json => {
          alert("✅ Saved successfully!");
        })
        .catch(() => alert("❌ Error saving data."));
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark');
      localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }

    (function () {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.body.classList.add('dark');
      }
    })();
  </script>

</body>
</html>
